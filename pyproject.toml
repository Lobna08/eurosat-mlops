[tool.poetry]
name = "eurosat-mlops"
version = "0.1.0"
description = "Classification EuroSAT RGB (CNN vs Vision Transformer) industrialisee avec DVC, MLflow, FastAPI et React"
authors = ["Lobna Ahmed <lobnaahmed325@gmail.com>"]
# Convention TP1 : src/ installe en mode editable, ce qui permet les stages DVC
# "python src/.../script.py" (convention TP2) avec des imports absolus "from src...".
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
# PyTorch : wheels PyPI sur macOS (Apple Silicon, backend MPS) ;
# index pytorch-cpu sur Linux (CI + Docker).
torch = [
    { version = "^2.9", source = "PyPI", markers = "sys_platform == 'darwin'" },
    { version = "^2.9", source = "pytorch-cpu", markers = "sys_platform != 'darwin'" },
]
torchvision = [
    { version = "^0.29", source = "PyPI", markers = "sys_platform == 'darwin'" },
    { version = "^0.29", source = "pytorch-cpu", markers = "sys_platform != 'darwin'" },
]
numpy = "^2.1"
pandas = "^2.2"
scikit-learn = "^1.5"
pyyaml = "^6.0"
matplotlib = "^3.9"
pillow = "^11.0"
mlflow = "^2.22"
# MLflow 2.22 importe FallbackAsyncAdaptedQueuePool, retire dans SQLAlchemy 2.1.
sqlalchemy = ">=2.0,<2.1"
dvc = "^3.59"
onnx = "^1.19"
onnxruntime = "^1.23"
onnxscript = "^0.7.2"
python-multipart = "^0.0.34"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.2"
isort = "^5.13"
flake8 = "^7.0"
pre-commit = "^3.6"
httpx = "^0.28"

# PyPI declare explicitement : requis par Poetry 2.x pour "source = PyPI".
[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "backend", "app"]
